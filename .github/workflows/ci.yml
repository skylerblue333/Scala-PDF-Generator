name: scala-pdf-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - run: sbt -batch compile test
      - name: CLI smoke
        run: |
          rm -f /tmp/sky-report.pdf
          sbt -batch 'run /tmp/sky-report.pdf Smoke hello world'
          test -s /tmp/sky-report.pdf
          head -c 8 /tmp/sky-report.pdf | grep '%PDF-1.4'
